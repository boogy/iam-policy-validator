# ============================================================================
# 21. NOT_ACTION_NOT_RESOURCE
# ============================================================================
# Check for dangerous NotAction/NotResource patterns in IAM policies
#
# NotAction and NotResource are powerful IAM features that can be misused to
# grant overly broad permissions. This check detects patterns that violate
# the principle of least privilege.
#
# Patterns detected:
#   1. NotAction with Effect: Allow - grants everything EXCEPT listed actions
#   2. NotResource with wildcards - grants access to all resources except listed
#   3. NotAction in Allow without strict conditions - missing safeguards
#
# These patterns are particularly dangerous because they grant permissions
# by exclusion rather than explicit inclusion, making it easy to accidentally
# grant more access than intended.
not_action_not_resource:
  enabled: true
  severity: high # Security issue: high severity for unconditioned NotAction
  description: "Checks for dangerous NotAction/NotResource patterns"

  # Customize messages (optional)
  # message: "Statement uses NotAction/NotResource pattern"
  # suggestion: "Consider using explicit Action/Resource lists instead"

  # ignore_patterns available - see top of file for usage examples
  # Example:
  # ignore_patterns:
  #   # Ignore NotAction Deny patterns in permission boundary policies
  #   - filepath: ".*permission-boundary.*"
  #     action: ".*"

# ============================================================================
# 22. NOT_PRINCIPAL VALIDATION
# ============================================================================
# Check for NotPrincipal usage patterns in IAM policies
#
# NotPrincipal is a powerful but dangerous IAM feature. When used with Allow,
# it grants access to ALL principals EXCEPT those listed - often unintended.
# When used with Deny, it exempts listed principals from the denial.
#
# Patterns detected:
#   1. NotPrincipal with Effect: Allow - grants broad access by exclusion
#   2. NotPrincipal usage in resource policies - may expose resources
#   3. NotPrincipal without restrictive conditions - missing safeguards
not_principal_validation:
  enabled: true
  severity: warning
  description: "Checks for NotPrincipal usage patterns that may unintentionally grant broad access"
  # ignore_patterns available - see top of file for usage examples

# ============================================================================
# CUSTOM CHECKS - Business Rules
# ============================================================================
# Two ways to load your own PolicyCheck subclasses. They can be combined.
# For examples, see: examples/custom_checks/
# ============================================================================

# 1. Directory auto-discovery
# Every PolicyCheck subclass found in *.py under this directory is registered
# using its own check_id. Relative paths resolve from the working directory.
# CLI equivalent: --custom-checks-dir ./custom_checks
# Default: null
# custom_checks_dir: "./custom_checks"

# 2. Explicit module list
# Each entry names one class as "package.module.ClassName". Use this when the
# check lives in an installed package rather than a local directory.
# Default: []
# custom_checks:
#   - module: "my_org.iam_checks.require_owner_tag.RequireOwnerTag"
#     enabled: true
#     severity: high
#     description: "Every statement must be scoped by an Owner tag"
#     # Passed to the check as its own config namespace
#     config:
#       required_tag: "Owner"
#       exempt_sids:
#         - "AllowPublicRead"
#
#   - module: "my_org.iam_checks.naming.RoleNamingConvention"
#     enabled: false

# Once a custom check is registered, configure it exactly like a built-in one —
# a top-level block keyed by its check_id. The loader logs
# "Unknown check ID '<id>' ... may be a custom check or a typo" for any block it
# does not recognize as built-in; that warning is expected for custom checks.
# require_owner_tag:
#   enabled: true
#   severity: high
#   hide_severities:
#     - low
#   ignore_patterns:
#     - filepath: "^examples/.*"

# ============================================================================
# LEGACY: NESTED `checks:` BLOCK
# ============================================================================
# The flat layout used above (one top-level block per check_id) is the current
# form. A legacy nested layout is still accepted, and a `checks:` key at the top
# level makes it the ONLY source of check config — top-level check blocks are
# then ignored. Do not mix the two.
# checks:
#   wildcard_action:
#     enabled: true
#     severity: medium
